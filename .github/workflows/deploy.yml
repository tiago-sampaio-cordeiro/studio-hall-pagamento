name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Kamal Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KAMAL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "${{ vars.KAMAL_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install Bitwarden Secrets Manager CLI
        env:
          BWS_VERSION: 2.1.0
        run: |
          curl -fsSLO "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${BWS_VERSION}/bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip"
          curl -fsSLO "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${BWS_VERSION}/bws-sha256-checksums-${BWS_VERSION}.txt"
          grep " bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip$" "bws-sha256-checksums-${BWS_VERSION}.txt" | sha256sum -c -
          unzip -q "bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip"
          chmod +x bws
          sudo mv bws /usr/local/bin/bws
          command -v bws
          bws --version

      - name: Verify Kamal config
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: bundle exec kamal config > /dev/null

      - name: Run Kamal
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          bundle exec kamal deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          TAG="production-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Production ${TAG}" \
            --generate-notes
