name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Kamal Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KAMAL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ vars.KAMAL_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify Kamal config
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: bundle exec kamal config > /dev/null

      - name: Run Kamal
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          bundle exec kamal deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          TAG="production-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Production ${TAG}" \
            --generate-notes
